<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Tracker</title>
<style>
  :root{
    --bg:#f5f6fa;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e8eaf0;
    --accent:#2563eb;--accent-soft:#eaf1ff;
    --green:#15803d;--green-soft:#dcfce7;--blue:#1d4ed8;--blue-soft:#e0eaff;
    --amber:#b45309;--amber-soft:#fef3c7;--gray:#4b5563;--gray-soft:#f1f3f6;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .brand{font-weight:650;font-size:16px}
  nav a{margin-left:6px;padding:7px 14px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
  nav a:hover{background:var(--gray-soft)}nav a.active{background:var(--accent);color:#fff}
  main{max-width:1040px;margin:28px auto 60px;padding:0 20px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;font-weight:600}
  .card h2 small{text-transform:none;letter-spacing:0;font-weight:400}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{margin:0}.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--mute);font-size:12px}

  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--mute);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tr.click{cursor:pointer}tr.click:hover{background:#f7f9ff}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  .trunc{display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mute{color:var(--mute)}.right{text-align:right}

  .badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
  .b-green{background:var(--green-soft);color:var(--green)}.b-blue{background:var(--blue-soft);color:var(--blue)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}.b-gray{background:var(--gray-soft);color:var(--gray)}

  button{font:inherit;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;font-weight:500}
  button:hover{background:var(--gray-soft)}

  .pagehead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .pagehead .title{min-width:0}.pagehead h1{font-size:18px;margin:0;word-break:break-all}
  .pagehead p{margin:0;color:var(--mute);font-size:13px}

  .bars{display:flex;align-items:flex-end;gap:4px;height:100px;overflow-x:auto;padding-top:6px}
  .bar{min-width:18px;flex:1;max-width:46px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.9}
  .bar:hover{opacity:1}
  .axis{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:6px}

  .rate{display:flex;align-items:center;gap:8px;min-width:110px}
  .track{flex:1;height:7px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:99px}

  .rcpt-head{display:flex;align-items:center;gap:12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:650;flex:none;text-transform:uppercase}
  .who{flex:1;min-width:0}.who b{display:block;word-break:break-all}.who .mono{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{display:flex;gap:36px;flex-wrap:wrap;margin:14px 0 4px;padding:12px 0;border-top:1px solid var(--line)}
  .meta span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
  .meta b{font-weight:600}.meta small{color:var(--mute);margin-left:4px}
  .hist-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:8px 0 2px}
  .hrow{display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
  .hrow:last-of-type{border-bottom:0}
  .place{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .note{background:var(--gray-soft);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--mute);margin-top:10px}
  details.more summary{cursor:pointer;color:var(--accent);padding:8px 0;font-weight:500}
  .empty{text-align:center;color:var(--mute);padding:30px 10px}

  .loc{display:grid;grid-template-columns:minmax(180px,1.3fr) 2fr 70px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .loc:last-child{border-bottom:0}
  .loc .where{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
  .err{color:#b91c1c}

  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0 4px;color:var(--mute);font-size:13px}
  .pager .nav{display:flex;align-items:center;gap:8px}
  .pager button{padding:4px 12px}.pager button:disabled{opacity:.45;cursor:default;background:#fff}
  .pager select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}

  @media (max-width:720px){
    header{padding:10px 14px}main{padding:0 12px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .hrow{grid-template-columns:1fr;gap:4px}
    .loc{grid-template-columns:1fr;gap:6px}
    .meta{gap:20px}
  }
</style>
</head>
<body>
<header><div class="brand">📬 Email Tracker</div>
  <nav><a id="tab-campaigns" href="#">Campaigns</a><a id="tab-locations" href="#/locations">Locations</a></nav></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- formatting ----------
const fmt = d => d ? new Date(d).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtTime = d => new Date(d).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit' });
function ago(d) {
  if (!d) return '';
  const s = Math.max(0, (Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'just now';
  const m = s / 60, h = m / 60, day = h / 24;
  if (m < 60) return Math.floor(m) + ' min ago';
  if (h < 24) return Math.floor(h) + ' h ago';
  return Math.floor(day) + ' d ago';
}
// Show the receiver's email instead of the internal thread / parent id.
const emailsLabel = (list, fallback) => {
  const l = (list || []).filter(Boolean);
  if (!l.length) return fallback;
  return l.length <= 2 ? l.join(', ') : `${l[0]}, ${l[1]} +${l.length - 2} more`;
};
const rate = (o, r) => r ? Math.round(o / r * 100) : 0;
const badge = (text, kind) => `<span class="badge b-${kind}">${esc(text)}</span>`;

// ---------- where did an open come from ----------
const SRC = {
  'google-proxy': ['Google proxy', 'blue'], 'apple-proxy': ['Apple proxy', 'blue'],
  'yahoo-proxy': ['Yahoo proxy', 'blue'], scanner: ['Scanner', 'amber'],
};
const isProxy = o => !!SRC[o.source] && o.source !== 'scanner';
const where = o => [o.city, o.region, o.country].filter(Boolean).join(', ');
function srcBadge(o) {
  if (SRC[o.source]) return badge(SRC[o.source][0], SRC[o.source][1]);
  return o.source === 'direct' ? badge('Direct', 'green') : '';
}
function placeHtml(o) {
  const w = where(o);
  return (w ? `<span>📍 ${esc(w)}</span>` : '<span class="mute">📍 Unknown location</span>') +
    srcBadge(o) + (o.owner ? badge('You · not counted', 'gray') : '');
}
const PROXY_NOTE = '<div class="note">ℹ️ Gmail, Apple and Yahoo load images on the reader\'s behalf, so for proxy opens the location is the proxy server\'s, not where the reader is.</div>';

// ---------- plumbing ----------
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
// Navigation without putting ids into inline JS: elements carry data-go.
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (t) location.hash = t.dataset.go;
});

// ---------- pagination (client-side; page size 'all' turns it off) ----------
const SIZES = ['10', '25', '50', '100', 'all'];
let pageSize = localStorage.getItem('pageSize');
if (!SIZES.includes(pageSize)) pageSize = '10';
const pages = {};
function paginate(key, items) {
  const all = pageSize === 'all', size = all ? items.length || 1 : +pageSize;
  const total = Math.max(1, Math.ceil(items.length / size));
  const cur = Math.min(Math.max(1, pages[key] || 1), total);
  pages[key] = cur;
  const from = (cur - 1) * size;
  const slice = all ? items : items.slice(from, from + size);
  const sel = `<label>Per page <select data-size>${SIZES.map(s => `<option value="${s}"${s === pageSize ? ' selected' : ''}>${s === 'all' ? 'All (no pagination)' : s}</option>`).join('')}</select></label>`;
  if (items.length <= 10 && pageSize !== 'all' && total === 1 && items.length <= +pageSize) {
    return { slice, bar: items.length > 5 ? `<div class="pager"><span>${items.length} total</span>${sel}</div>` : '' };
  }
  const info = all ? `Showing all ${items.length}` : `Showing ${from + 1}–${Math.min(from + size, items.length)} of ${items.length}`;
  const nav = all ? '' : `<div class="nav"><button data-page="${key}" data-to="${cur - 1}"${cur <= 1 ? ' disabled' : ''}>‹ Prev</button>
    <span>Page ${cur} of ${total}</span><button data-page="${key}" data-to="${cur + 1}"${cur >= total ? ' disabled' : ''}>Next ›</button></div>`;
  return { slice, bar: `<div class="pager"><span>${info}</span>${nav}${sel}</div>` };
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (b && !b.disabled) { pages[b.dataset.page] = +b.dataset.to; route(); }
});
document.addEventListener('change', e => {
  if (!e.target.matches('[data-size]')) return;
  pageSize = e.target.value; localStorage.setItem('pageSize', pageSize);
  for (const k in pages) delete pages[k];
  route();
});
window.onhashchange = () => { for (const k in pages) delete pages[k]; route(); };

async function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const onLocations = id === '/locations';
  $('#tab-locations').classList.toggle('active', onLocations);
  $('#tab-campaigns').classList.toggle('active', !onLocations);
  try { app.innerHTML = onLocations ? await locations() : id ? await detail(id) : await list(); }
  catch (e) { app.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}
const go = id => `data-go="${esc(encodeURIComponent(id))}"`;
const stat = (n, l) => `<div class="card stat"><b>${n}</b><span>${l}</span></div>`;

// ---------- Campaigns ----------
async function list() {
  const rows = await api('/api/parents');
  if (!rows.length) return '<div class="card empty">No tracked emails yet.<br>Create a pixel with <span class="mono">POST /api/pixels</span>.</div>';
  const totals = rows.reduce((a, r) => ({ sent: a.sent + r.recipients, opened: a.opened + r.opened, opens: a.opens + r.totalOpens }), { sent: 0, opened: 0, opens: 0 });
  const pg = paginate('campaigns', rows);
  return `<div class="stats">${stat(rows.length, 'Campaigns')}${stat(totals.sent, 'Emails sent')}${stat(totals.opened, 'Opened')}${stat(rate(totals.opened, totals.sent) + '%', 'Open rate')}</div>
  <div class="card"><h2>Campaigns</h2><div class="scroll"><table>
  <tr><th>Recipient</th><th>Messages</th><th>Sent</th><th>Opened</th><th>Open rate</th><th>Total opens</th><th>Last open</th></tr>
  ${pg.slice.map(r => `<tr class="click" ${go(r.parent_id)}>
    <td><span class="trunc" title="${esc((r.emails || []).join(', '))}">${esc(emailsLabel(r.emails, r.parent_id))}</span></td>
    <td>${r.messages}</td><td>${r.recipients}</td><td>${r.opened}</td>
    <td><div class="rate"><div class="track"><div class="fill" style="width:${rate(r.opened, r.recipients)}%"></div></div>${rate(r.opened, r.recipients)}%</div></td>
    <td>${r.totalOpens}</td>
    <td>${r.lastOpenedAt ? `${fmt(r.lastOpenedAt)} <span class="mute">${ago(r.lastOpenedAt)}</span>` : '<span class="mute">—</span>'}</td></tr>`).join('')}
  </table></div>${pg.bar}</div>`;
}

// ---------- One campaign ----------
function recipientCard(e) {
  const opened = e.openCount > 0;
  const shown = e.opens.slice(0, 5), more = e.opens.slice(5);
  const row = o => `<div class="hrow"><b>${fmtTime(o.at)}</b><div class="place">${placeHtml(o)}</div><span class="mono mute">${esc(o.ip || '')}</span></div>`;
  return `<div class="card">
    <div class="rcpt-head">
      <div class="avatar">${esc((e.email || '?')[0])}</div>
      <div class="who"><b>${esc(e.email)}</b></div>
      ${badge(opened ? 'Opened' : 'Not opened', opened ? 'green' : 'gray')}
    </div>
    <div class="meta">
      <div><span>Opens</span><b>${e.openCount}</b></div>
      <div><span>First opened</span><b>${e.firstOpenedAt ? fmt(e.firstOpenedAt) : '—'}</b><small>${ago(e.firstOpenedAt)}</small></div>
      <div><span>Last opened</span><b>${e.lastOpenedAt ? fmt(e.lastOpenedAt) : '—'}</b><small>${ago(e.lastOpenedAt)}</small></div>
    </div>
    ${e.opens.length ? `<div class="hist-title">Open history</div>${shown.map(row).join('')}
      ${more.length ? `<details class="more"><summary>Show ${more.length} more</summary>${more.map(row).join('')}</details>` : ''}
      ${e.opens.some(isProxy) ? PROXY_NOTE : ''}` : '<div class="mute">No opens yet.</div>'}
  </div>`;
}

async function detail(id) {
  const d = await api('/api/parents/' + encodeURIComponent(id));
  const max = Math.max(1, ...d.timeline.map(t => t.opens));
  const pg = paginate('recipients', d.emails);
  const first = d.timeline[0], last = d.timeline[d.timeline.length - 1];
  return `<div class="pagehead"><button ${go('')}>← All</button>
    <div class="title"><h1>${esc(emailsLabel(d.emails.map(e => e.email), d.parent_id))}</h1><p>${d.recipients} email${d.recipients === 1 ? '' : 's'} tracked</p></div></div>
  <div class="stats">${stat(d.recipients, 'Recipients')}${stat(d.opened, 'Opened')}${stat(rate(d.opened, d.recipients) + '%', 'Open rate')}${stat(d.totalOpens, 'Total opens')}</div>
  <div class="card"><h2>Opens per hour</h2>${d.timeline.length
    ? `<div class="bars">${d.timeline.map(t => `<div class="bar" style="height:${Math.max(6, t.opens / max * 100)}%" title="${esc(fmt(t.hour))}: ${t.opens}"></div>`).join('')}</div>
       <div class="axis"><span>${fmt(first.hour)}</span><span>${fmt(last.hour)}</span></div>`
    : '<div class="mute">No opens yet.</div>'}</div>
  ${pg.bar}${pg.slice.map(recipientCard).join('')}${d.emails.length > 10 ? pg.bar : ''}`;
}

// ---------- Locations ----------
async function locations() {
  const opens = await api('/api/opens?limit=200');
  if (!opens.length) return '<div class="card empty">No opens recorded yet.</div>';
  const label = o => where(o) || 'Unknown location';
  const groups = {};
  for (const o of opens) {
    const k = label(o) + '|' + (o.source || 'direct');
    const g = groups[k] || (groups[k] = { o, place: label(o), count: 0, mine: 0, last: o.at });
    if (o.owner) g.mine++; else g.count++;
  }
  const summary = Object.values(groups).sort((a, b) => (b.count + b.mine) - (a.count + a.mine));
  const top = Math.max(1, ...summary.map(g => g.count + g.mine));
  const pg = paginate('opens', opens);
  return `<div class="card"><h2>Where opens come from <small>· latest ${opens.length} opens</small></h2>
    ${summary.map(g => `<div class="loc">
      <div class="where"><b>${esc(g.place)}</b><span>${srcBadge(g.o)}${g.mine ? ' ' + badge(g.mine + ' from you', 'gray') : ''}</span></div>
      <div class="track"><div class="fill" style="width:${(g.count + g.mine) / top * 100}%"></div></div>
      <div class="right"><b>${g.count}</b> <span class="mute">${g.count === 1 ? 'open' : 'opens'}</span></div></div>`).join('')}
    ${opens.some(isProxy) ? PROXY_NOTE : ''}</div>
  <div class="card"><h2>Latest opens</h2><div class="scroll"><table>
    <tr><th>When</th><th>Recipient</th><th>Location</th><th>IP</th></tr>
    ${pg.slice.map(o => `<tr class="click" ${go(o.campaign)}>
      <td style="white-space:nowrap"><b>${fmtTime(o.at)}</b><div class="mute" style="font-size:12px">${ago(o.at)}</div></td>
      <td>${esc(o.email)}</td>
      <td><div class="place">${placeHtml(o)}</div></td>
      <td class="mono mute">${esc(o.ip || '')}</td></tr>`).join('')}
  </table></div>${pg.bar}</div>`;
}

route();
</script>
</body>
</html>
